<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Klearvision — Coming Soon</title>
  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      color:#fff;
      background: linear-gradient(140deg, #0f0618, #2a0f3a);
      display:flex;
      justify-content:center;
      align-items:center;

    }
    .card{
      text-align:center;
      max-width:800px;
      padding:30px;
    }
    img{width:120px;margin-bottom:20px;}
    h1{margin-bottom:10px;}
    .tagline{color:#b26cff;margin-bottom:20px;}
    .countdown{font-size:28px;margin:20px 0;}
    .icons{display:flex;justify-content:center;gap:20px;margin-top:20px;}
    .icons a{color:white;text-decoration:none;}
    svg{width:28px;height:28px;}
  </style>
</head>
<body>
  <div class="card">
    <img src="assets/klearvision-logo.png" />
    <h1>Exciting update to our website coming soon</h1>
    <div class="tagline">African Language Dubbing, Global Stories, Local Voices</div>
    <div class="countdown" id="countdown"></div>

    <div class="icons">
      <a href="https://www.linkedin.com/in/abner-adolphus-briandt-09719632" target="_blank" title="LinkedIn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.45 20.45h-3.554v-5.569c0-1.329-.024-3.039-1.852-3.039-1.853 0-2.137 1.446-2.137 2.941v5.667H9.354V9h3.414v1.561h.049c.476-.9 1.637-1.852 3.368-1.852 3.6 0 4.265 2.37 4.265 5.455v6.286zM5.337 7.433a2.063 2.063 0 110-4.127 2.063 2.063 0 010 4.127zM7.119 20.45H3.554V9h3.565v11.45z"/>
        </svg>
      </a>

      <a href="tel:+233244434346" title="Call">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.11-.21c1.2.48 2.53.74 3.88.74a1 1 0 011 1V21a1 1 0 01-1 1C11.85 22 2 12.15 2 1a1 1 0 011-1h3.5a1 1 0 011 1c0 1.35.26 2.68.74 3.88a1 1 0 01-.21 1.11l-2.41 2.8z"/>

  </div>

<script>
const end = new Date().getTime() + 30*24*60*60*1000;
setInterval(()=>{
  const now = new Date().getTime();
  const diff = end - now;
  const d = Math.floor(diff/(1000*60*60*24));
  const h = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
  const m = Math.floor((diff%(1000*60*60))/(1000*60));
  const s = Math.floor((diff%(1000*60))/1000);
  document.getElementById("countdown").innerHTML =
    d+"d "+h+"h "+m+"m "+s+"s";
},1000);
</script>

</body>
</html>
